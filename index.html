<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بازی فرار از معبد</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: Tahoma, sans-serif; touch-action: none; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); color: white; padding: 30px; border-radius: 15px; text-align: center; display: none; z-index: 20; width: 80%; max-width: 300px; }
        button { background: #28a745; color: white; border: none; padding: 12px 25px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-family: Tahoma; }
        button:hover { background: #218838; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">امتیاز: <span id="score">0</span></div>
    <div id="gameOver">
        <h2>باختی!</h2>
        <p>امتیاز نهایی: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">بازی مجدد</button>
    </div>

    <script>
        let scene, camera, renderer, player;
        let lanes = [-2.5, 0, 2.5];
        let currentLane = 1;
        let isJumping = false;
        let jumpVelocity = 0;
        let gravity = -0.025;
        let obstacles = [];
        let coins = [];
        let score = 0;
        let gameSpeed = 0.35;
        let isGameOver = false;
        let frameCount = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 15, 65);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 9);
            camera.lookAt(0, 1, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // نورپردازی
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // زمین مسیر
            const groundGeo = new THREE.PlaneGeometry(10, 200);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -80;
            scene.add(ground);

            // خطوط جداکننده مسیر
            const lineGeo = new THREE.PlaneGeometry(0.15, 200);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line1 = new THREE.Mesh(lineGeo, lineMat);
            line1.rotation.x = -Math.PI / 2;
            line1.position.set(-1.25, 0.01, -80);
            scene.add(line1);

            const line2 = new THREE.Mesh(lineGeo, lineMat);
            line2.rotation.x = -Math.PI / 2;
            line2.position.set(1.25, 0.01, -80);
            scene.add(line2);

            // بازیکن
            const playerGeo = new THREE.BoxGeometry(1, 1.5, 1);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0x007bff });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(lanes[currentLane], 0.75, 0);
            scene.add(player);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyDown);
            setupTouchControls();

            animate();
        }

        function spawnObjects() {
            const laneIndex = Math.floor(Math.random() * 3);
            const isCoin = Math.random() > 0.6;

            if (isCoin) {
                const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.15, 16);
                const coinMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(lanes[laneIndex], 1, -70);
                scene.add(coin);
                coins.push(coin);
            } else {
                const obsGeo = new THREE.BoxGeometry(1.6, 1.4, 1.4);
                const obsMat = new THREE.MeshLambertMaterial({ color: 0xdc3545 });
                const obstacle = new THREE.Mesh(obsGeo, obsMat);
                obstacle.position.set(lanes[laneIndex], 0.7, -70);
                scene.add(obstacle);
                obstacles.push(obstacle);
            }
        }

        function handleKeyDown(e) {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) currentLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) currentLane++;
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !isJumping) {
                isJumping = true;
                jumpVelocity = 0.42;
            }
        }

        function setupTouchControls() {
            let touchStartX = 0;
            let touchStartY = 0;
            document.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            });
            document.addEventListener('touchend', e => {
                if (isGameOver) return;
                let dx = e.changedTouches[0].screenX - touchStartX;
                let dy = e.changedTouches[0].screenY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 30 && currentLane < 2) currentLane++;
                    else if (dx < -30 && currentLane > 0) currentLane--;
                } else {
                    if (dy < -30 && !isJumping) {
                        isJumping = true;
                        jumpVelocity = 0.42;
                    }
                }
            });
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            frameCount++;
            if (frameCount % 45 === 0) {
                spawnObjects();
                gameSpeed += 0.002; // افزایش تدریجی سرعت
            }

            // حرکت نرم بین خطوط
            player.position.x += (lanes[currentLane] - player.position.x) * 0.2;

            // منطق پرش
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity += gravity;
                if (player.position.y <= 0.75) {
                    player.position.y = 0.75;
                    isJumping = false;
                }
            }

            const playerBox = new THREE.Box3().setFromObject(player);

            // حرکت موانع و بررسی برخورد
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += gameSpeed;
                const obsBox = new THREE.Box3().setFromObject(obstacles[i]);
                if (playerBox.intersectsBox(obsBox)) {
                    endGame();
                }
                if (obstacles[i].position.z > 10) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                }
            }

            // حرکت سکه‌ها و جمع‌آوری امتیاز
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].position.z += gameSpeed;
                coins[i].rotation.z += 0.05;
                const coinBox = new THREE.Box3().setFromObject(coins[i]);
                if (playerBox.intersectsBox(coinBox)) {
                    score += 10;
                    document.getElementById('score').innerText = score;
                    scene.remove(coins[i]);
                    coins.splice(i, 1);
                    continue;
                }
                if (coins[i].position.z > 10) {
                    scene.remove(coins[i]);
                    coins.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function resetGame() {
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];
            score = 0;
            gameSpeed = 0.35;
            currentLane = 1;
            player.position.set(0, 0.75, 0);
            isJumping = false;
            isGameOver = false;
            document.getElementById('score').innerText = '0';
            document.getElementById('gameOver').style.display = 'none';
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
